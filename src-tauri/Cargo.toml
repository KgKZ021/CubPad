[package]
name = "cub-pad"
version = "0.1.0"
description = "A warm, cozy German class note-taking desktop application"
authors = ["Cub Pad Team"]
edition = "2021"

[lib]
name = "cub_pad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
