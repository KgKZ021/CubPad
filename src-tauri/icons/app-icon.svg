<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FFF8EE" />
      <stop offset="100%" stop-color="#F3E5CC" />
    </radialGradient>
    <filter id="cozyShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#553A1B" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Squircle Base for macOS -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="#D8CBAF" stroke-width="12" filter="url(#cozyShadow)" />

  <!-- Paw / Puppy Footprint in Warm Golden Tone -->
  <g fill="#D97736" stroke="#B85F24" stroke-width="6" stroke-linejoin="round">
    <!-- Main Paw Pad -->
    <ellipse cx="256" cy="310" rx="90" ry="70" />
    
    <!-- Left Toe Pad -->
    <ellipse cx="160" cy="190" rx="35" ry="48" transform="rotate(-18 160 190)" />
    
    <!-- Middle-Left Toe Pad -->
    <ellipse cx="222" cy="155" rx="35" ry="50" transform="rotate(-6 222 155)" />
    
    <!-- Middle-Right Toe Pad -->
    <ellipse cx="290" cy="155" rx="35" ry="50" transform="rotate(6 290 155)" />
    
    <!-- Right Toe Pad -->
    <ellipse cx="352" cy="190" rx="35" ry="48" transform="rotate(18 352 190)" />
  </g>

  <!-- Cute Inner Paw Highlights -->
  <g fill="#FBEBD6" opacity="0.6">
    <ellipse cx="256" cy="295" rx="55" ry="38" />
    <ellipse cx="160" cy="180" rx="20" ry="28" transform="rotate(-18 160 180)" />
    <ellipse cx="222" cy="148" rx="20" ry="30" transform="rotate(-6 222 148)" />
    <ellipse cx="290" cy="148" rx="20" ry="30" transform="rotate(6 290 148)" />
    <ellipse cx="352" cy="180" rx="20" ry="28" transform="rotate(18 352 180)" />
  </g>

  <!-- Cute Pencil / Quill accent -->
  <path d="M 330 360 L 380 410 L 360 418 L 330 380 Z" fill="#7E7267" />
  <polygon points="380,410 395,425 360,418" fill="#FAF6EE" stroke="#7E7267" stroke-width="2" />
  <polygon points="392,422 395,425 388,425" fill="#332D29" />
</svg>
